name: QABS Platform CI & Quality Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      VAULT_ENCRYPTION_SECRET: qabs-ci-only-vault-secret-do-not-use-in-production

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run TypeScript & Lint Checks
      run: npm run lint

    - name: Run Test Suite
      run: npm test

    - name: Build Application Bundle
      run: npm run build

    - name: Security & Secret Scan
      run: |
        echo "Running zero-leak secrets audit..."
        if grep -RInE "sk_live_|rk_live_|shpat_|AKIA[0-9A-Z]" --exclude-dir=node_modules --exclude-dir=.git .; then
          echo "ERROR: Discovered live secret in codebase!"
          exit 1
        fi
        echo "Security check passed: no known live-key patterns found."
